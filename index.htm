<!-- ============ CONTACT ============ -->
  <section id="contact" class="luxe-section">
    <div class="container">
      <div class="row g-5 align-items-center">
        <div class="col-lg-5">
          <span class="luxe-eyebrow">Contact</span>
          <h2 class="section-title text-start">Let's talk books.</h2>
          <p class="section-sub text-start">Have a question, a suggestion, or want to partner with LuxeLibrary? We'd love to hear from you.</p>
          <ul class="contact-list">
            <li><i class="bi bi-envelope"></i> hello@luxelibrary.com</li>
            <li><i class="bi bi-telephone"></i> +1 (415) 555 — 0142</li>
            <li><i class="bi bi-geo-alt"></i> 221 Pine Street, San Francisco</li>
          </ul>
        </div>
        <div class="col-lg-7">
          <form class="contact-form" onsubmit="return false;">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label">Name</label>
                <input type="text" class="form-control" placeholder="Your full name" required />
              </div>
              <div class="col-md-6">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" placeholder="you@example.com" required />
              </div>
              <div class="col-12">
                <label class="form-label">Message</label>
                <textarea class="form-control" rows="5" placeholder="How can we help?" required></textarea>
              </div>
              <div class="col-12">
                <button type="submit" class="btn btn-luxe-primary btn-lg w-100">Send Message</button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </section>
